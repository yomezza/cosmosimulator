name: UI contracts

on:
  push:
    branches: [main]
    paths:
      - 'internal/server/**'
      - 'tests/ui/**'
      - '.github/workflows/ui-contracts.yml'
      - 'go.mod'
      - 'go.sum'
  pull_request:
    paths:
      - 'internal/server/**'
      - 'tests/ui/**'
      - '.github/workflows/ui-contracts.yml'
      - 'go.mod'
      - 'go.sum'

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tests/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/ui/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm test
  server-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: env -u TEST_DATABASE_URL go test ./... -count=1
      - run: go vet ./...
